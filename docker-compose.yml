# Boldpiq Website Audit — internal web app
#
# IMPORTANT: the port is bound to localhost only. There is no authentication in
# the app itself; access is granted by the Cloudflare Tunnel + Access policy in
# front of it, exactly like n8n. Never publish this port to 0.0.0.0.

services:
  audit:
    build: .
    image: boldpiq/website-audit:latest
    container_name: boldpiq-audit
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:8090"
    networks:
      # Private network shared only with this app's own cloudflared connector.
      # Deliberately NOT the n8n tunnel network: that tunnel's catch-all proxies
      # to n8n, so any unrouted hostname on it serves the n8n UI. A dedicated
      # tunnel with a single origin cannot fall through to anything.
      - audit_net
    volumes:
      # Finished PDFs and scan JSON survive rebuilds and redeploys.
      - audit-reports:/data/reports
    environment:
      # Courtesy gap between consecutive scans. seoscore.tools' terms forbid
      # excessive scanning and jobs already run one at a time — this is the
      # second layer of that promise.
      BOLDPIQ_JOB_GAP: "6"
      BOLDPIQ_JOB_TIMEOUT: "600"
    # Chrome is memory-hungry in bursts. Capping keeps a runaway scan from
    # taking n8n and Zammad down with it.
    mem_limit: 2g
    cpus: 1.5
    security_opt:
      - no-new-privileges:true
    tmpfs:
      # Chromium's shared memory. Without this it falls back to /dev/shm at 64MB
      # and crashes on heavy pages.
      - /tmp:size=512m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Dedicated Cloudflare connector for this app and nothing else.
  #
  # --url pins the ONLY origin this tunnel can ever reach. There is no catch-all
  # to fall through to, so a stray hostname pointed here reaches the audit app
  # or nothing — never another service.
  #
  # TUNNEL_TOKEN lives in .env on the server (git-ignored, chmod 600). It is a
  # credential: anyone holding it can connect a tunnel into the account.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: boldpiq-audit-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate --protocol http2 run --token ${TUNNEL_TOKEN} --url http://boldpiq-audit:8090
    depends_on:
      - audit
    networks:
      - audit_net
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  audit-reports:

networks:
  audit_net:
